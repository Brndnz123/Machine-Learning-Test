name: Run Daily BIST Advisor and Update Dashboard

on:
  schedule:
    # Runs at 15:05 UTC (which matches 18:05 Turkish Local Time) every single trading day
    - cron: '5 15 * * 1-5'
  workflow_dispatch: # Allows you to trigger it manually via the GitHub UI anytime

jobs:
  build-and-deploy:
  jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Grant explicit Write permissions to allow GitHub Actions to update history.json
    permissions:
      contents: write
      
    steps:
    - name: Checkout repository
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install numpy pandas yfinance scipy scikit-learn

    - name: Run Model and Update JSON History
      run: |
        python update_dashboard_data.py

    - name: Commit and Push Updated Dashboard Data
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add history.json
        git commit -m "Daily automated balance update [skip ci]" || exit 0
        git push
